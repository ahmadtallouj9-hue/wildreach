<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Cubic Character — Preview</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif}
  h1{color:#c9a227;letter-spacing:.2em;text-transform:uppercase;font-size:.85rem;margin-bottom:6px;margin-top:18px}
  p.sub{color:#555;font-size:.65rem;letter-spacing:.1em;margin-bottom:16px}
  #c{border-radius:22px;display:block;box-shadow:0 12px 60px rgba(0,0,0,.7)}
</style>
</head>
<body>
<canvas id="c" width="520" height="600"></canvas>
<h1>Cubic Character Mode</h1>
<p class="sub">Preview only — no game changes made</p>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ─── Renderer ─── */
const canvas = document.getElementById('c');
const W = 520, H = 600;
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

/* ─── Scene ─── */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8d4e8);
scene.fog = new THREE.Fog(0xb8d4e8, 12, 28);

/* ─── Camera ─── */
const camera = new THREE.PerspectiveCamera(34, W/H, 0.05, 40);
camera.position.set(2.6, 2.1, 4.0);
camera.lookAt(0, 1.05, 0);

/* ─── Lights ─── */
const amb = new THREE.AmbientLight(0xe8f0ff, 0.75);
scene.add(amb);

const sun = new THREE.DirectionalLight(0xfff4e0, 2.2);
sun.position.set(4, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 40;
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6;
sun.shadow.camera.top = 6; sun.shadow.camera.bottom = -6;
sun.shadow.bias = -0.001;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x8ab4d4, 0.9);
fill.position.set(-3, 2, -2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.4);
rim.position.set(0, 1, -4);
scene.add(rim);

/* ─── Helpers ─── */
function mat(color, rough=0.85, metal=0){
  return new THREE.MeshStandardMaterial({color, roughness:rough, metalness:metal});
}
function bx(w,h,d,m,pivotTop=false){
  const g=new THREE.BoxGeometry(w,h,d);
  if(pivotTop) g.translate(0,-h/2,0);
  const mesh=new THREE.Mesh(g,m);
  mesh.castShadow=true; mesh.receiveShadow=true;
  return mesh;
}
// Canvas texture helper
function ctex(w,h,draw){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  draw(cv.getContext('2d'), w, h);
  const t=new THREE.CanvasTexture(cv);
  t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter;
  return t;
}

/* ─── Ground platform ─── */
const groundGeo = new THREE.CylinderGeometry(3.8, 3.8, 0.08, 64);
const groundMesh = new THREE.Mesh(groundGeo, mat(0xdde8f0, 0.9));
groundMesh.receiveShadow=true;
groundMesh.position.y = -0.04;
scene.add(groundMesh);

// Inner spotlight circle
const circleGeo = new THREE.CylinderGeometry(1.3, 1.3, 0.001, 64);
const circleMesh = new THREE.Mesh(circleGeo, new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.6,transparent:true,opacity:0.55}));
circleMesh.position.y = 0.001;
scene.add(circleMesh);

/* ─── Trees (blocky style) ─── */
function tree(x,z,scale=1){
  const g=new THREE.Group();
  // trunk
  const trunk=bx(0.22*scale,0.55*scale,0.22*scale,mat(0x6b4226,0.9));
  trunk.position.set(0,0.275*scale,0);
  // foliage layers
  [[0.72*scale,0.38*scale,0xf5f5f5],[0.6*scale,0.32*scale,0xf5f5f5],[0.45*scale,0.28*scale,0xf5f5f5]].forEach(([s,h,c],i)=>{
    const lm=mat(c===0xf5f5f5 ? (i===0?0x4a9940:i===1?0x3d8535:0x2d6a28) : c, 0.85);
    const layer=bx(s,h,s,lm); layer.position.set(0,(0.55+h/2+i*0.22)*scale,0);
    g.add(layer);
  });
  g.add(trunk);
  g.position.set(x,0,z);
  g.castShadow=true;
  scene.add(g);
}
tree(-2.8, -1.2, 1.1);
tree( 2.6, -1.0, 1.0);
tree(-2.2,  1.8, 0.85);
tree( 3.0,  0.8, 0.95);
tree(-1.0, -2.8, 0.75);
tree( 0.8, -3.0, 0.80);

// Stone block decorations
function stoneBlock(x,y,z,sx=1,sy=1,sz=1){
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.38*sx,0.38*sy,0.38*sz),mat(0x9aa0a8,0.95));
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  scene.add(m);
}
stoneBlock(2.2, 0.19, 0.5);
stoneBlock(2.2, 0.57, 0.5, 0.7, 0.7, 0.7);
stoneBlock(-2.3, 0.19, 0.2);

/* ─── CUBIC CHARACTER ─── */
// Proportions: tall=0.72, wide=1.48, armThin=1.42
const T=0.72, W2=1.48, AT=1.42;
const LEG_H=0.80*T, TOR_H=0.68*T, HD=0.42*T;
const ARM_H_=0.64*T, ARM_W_=0.18*AT, LEG_W_=0.22;
const TOR_W=0.52*W2, TOR_D=0.30;
const hipY=LEG_H, tcY=hipY+TOR_H*0.5, shY=hipY+TOR_H-0.04*T, hcY=hipY+TOR_H+HD*0.5;

const char = new THREE.Group();

/* --- Boots --- */
const bootMat = mat(0x4a3020,0.92);
const bootH = 0.1*T;
function boot(side){
  const b=new THREE.Group();
  const sole=bx(LEG_W_*W2*1.12, bootH*0.4, LEG_W_*1.25, mat(0x2a1a10,0.98)); sole.position.set(0,bootH*0.2,0.035);
  const upper=bx(LEG_W_*W2*1.08, bootH*0.65, LEG_W_*1.15, bootMat); upper.position.set(0,bootH*0.75,0.02);
  b.add(sole,upper);
  b.position.set(side*0.13*W2, bootH, 0);
  return b;
}
char.add(boot(-1), boot(1));

/* --- Legs (dark cargo pants) --- */
const pantsMat = mat(0x2e3038,0.88);
function leg(side, swingX=0){
  const l=bx(LEG_W_*W2, LEG_H, LEG_W_*1.05, pantsMat, true);
  l.rotation.x=swingX;
  l.position.set(side*0.13*W2, hipY, 0);
  return l;
}
const legR=leg(-1, 0.22), legL=leg(1,-0.18);
char.add(legR,legL);

/* --- Torso (brown jacket) --- */
// Face texture for jacket
const jacketTex = ctex(16,16,(ctx,w,h)=>{
  ctx.fillStyle='#8B5E3C'; ctx.fillRect(0,0,w,h);
  // pocket lines
  ctx.fillStyle='#6B4020'; ctx.fillRect(2,9,4,4); ctx.fillRect(10,9,4,4);
  // zipper
  ctx.fillStyle='#4a3020'; ctx.fillRect(7,2,2,12);
  // collar
  ctx.fillStyle='#c8aa88'; ctx.fillRect(5,0,6,3);
});
const jacketMats = [
  mat(0x8B5E3C,0.88), mat(0x8B5E3C,0.88),
  mat(0x7a5030,0.88), mat(0x6B4020,0.88),
  new THREE.MeshStandardMaterial({map:jacketTex,roughness:0.88}),
  mat(0x7a5030,0.88)
];
const torso = new THREE.Mesh(new THREE.BoxGeometry(TOR_W,TOR_H,TOR_D), jacketMats);
torso.position.set(0,tcY,0); torso.castShadow=true;
char.add(torso);

/* --- Arms --- */
const armMat = mat(0x8B5E3C,0.88);
const handMat = mat(0xC4A882,0.82);
function arm(side, rx=0, rz=0){
  const g=new THREE.Group();
  const upper=bx(ARM_W_,ARM_H_*0.7,ARM_W_,armMat,true);
  const lower=bx(ARM_W_*0.92,ARM_H_*0.3,ARM_W_*0.92,handMat,true);
  lower.position.y=-(ARM_H_*0.7);
  g.add(upper,lower);
  g.rotation.x=rx; g.rotation.z=rz;
  g.position.set(side*(TOR_W*0.5+ARM_W_*0.42), shY, 0);
  return g;
}
// R arm swings forward (waving up), L arm back
const armRGroup = arm(-1, -1.05, -0.08); // waving
const armLGroup = arm( 1,  0.32,  0.08); // swung back
char.add(armRGroup, armLGroup);

/* --- Backpack --- */
const bpMat = mat(0x3a6090,0.88);
const bp = new THREE.Group();
const bpBody=bx(TOR_W*0.72,TOR_H*0.85,0.20,bpMat); bpBody.position.set(0,tcY,-TOR_D*0.5-0.105);
const bpTop=bx(TOR_W*0.5,TOR_H*0.18,0.18,mat(0x2e5070,0.88)); bpTop.position.set(0,tcY+TOR_H*0.44,-TOR_D*0.5-0.095);
const bpPocket=bx(TOR_W*0.5,TOR_H*0.3,0.08,mat(0x2a4a70,0.88)); bpPocket.position.set(0,tcY-TOR_H*0.22,-TOR_D*0.5-0.21);
// buckle
const bkl=bx(0.06,0.14,0.04,mat(0xc9a227,0.5,0.6)); bkl.position.set(0,tcY-TOR_H*0.22,-TOR_D*0.5-0.26);
bp.add(bpBody,bpTop,bpPocket,bkl);
char.add(bp);

/* --- Belt --- */
const belt=bx(TOR_W*1.02,0.07*T,TOR_D*1.05,mat(0x2a2830,0.9));
belt.position.set(0,hipY+TOR_H*0.08,0);
char.add(belt);

/* --- Head (skin) --- */
const headTex = ctex(8,8,(ctx)=>{
  ctx.fillStyle='#C4A882'; ctx.fillRect(0,0,8,8);
  // eyes
  ctx.fillStyle='#1a1a20'; ctx.fillRect(1,3,2,2); ctx.fillRect(5,3,2,2);
  // eyebrows
  ctx.fillStyle='#6B4220'; ctx.fillRect(1,2,2,1); ctx.fillRect(5,2,2,1);
  // nose
  ctx.fillStyle='#a07850'; ctx.fillRect(3,4,2,1);
  // mouth (smirk)
  ctx.fillStyle='#6B3010'; ctx.fillRect(2,6,1,1); ctx.fillRect(3,6,2,1); ctx.fillRect(5,6,1,1);
});
const headMat = [
  mat(0xC4A882,0.82), mat(0xC4A882,0.82),
  mat(0xb89a72,0.82), mat(0xb89a72,0.82),
  new THREE.MeshStandardMaterial({map:headTex,roughness:0.82}),
  mat(0xb89a72,0.82)
];
const head = new THREE.Mesh(new THREE.BoxGeometry(HD*W2,HD,HD*W2), headMat);
head.position.set(0,hcY,0); head.castShadow=true;
char.add(head);

/* --- Beanie hat (orange stripes) --- */
const hatTex = ctex(16,8,(ctx,w,h)=>{
  ctx.fillStyle='#d45a00'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#1a1a1a';
  for(let x=0;x<w;x+=4){ ctx.fillRect(x,0,2,h); }
});
const hatBase=new THREE.Mesh(new THREE.BoxGeometry(HD*W2*1.08,HD*0.5,HD*W2*1.08),
  new THREE.MeshStandardMaterial({map:hatTex,roughness:0.85}));
hatBase.position.set(0,hcY+HD*0.5,0); hatBase.castShadow=true;
const hatTop=bx(HD*W2*0.7,HD*0.22,HD*W2*0.7,mat(0xd45a00,0.85));
hatTop.position.set(0,hcY+HD*0.76,0);
// pom pom
const pom=new THREE.Mesh(new THREE.SphereGeometry(0.055,8,8),mat(0xeeeeee,0.95));
pom.position.set(0,hcY+HD*0.9,0);
char.add(hatBase,hatTop,pom);

/* --- Owl on left shoulder --- */
const owl=new THREE.Group();
const owlBody=bx(0.10,0.13,0.09,mat(0x7a6a50,0.88)); owlBody.position.set(0,0.065,0);
const owlHead=bx(0.09,0.09,0.09,mat(0x8a7a60,0.85)); owlHead.position.set(0,0.145,0);
const owlEyeL=bx(0.025,0.025,0.02,mat(0xf0e060,0.5)); owlEyeL.position.set(-0.025,0.152,0.048);
const owlEyeR=bx(0.025,0.025,0.02,mat(0xf0e060,0.5)); owlEyeR.position.set( 0.025,0.152,0.048);
const owlBeak=bx(0.02,0.02,0.02,mat(0xe09020,0.6)); owlBeak.position.set(0,0.136,0.053);
owl.add(owlBody,owlHead,owlEyeL,owlEyeR,owlBeak);
owl.position.set(TOR_W*0.5+ARM_W_*0.48, shY+0.05, 0.04);
owl.rotation.y=-0.3;
char.add(owl);

/* --- Waving hand (right arm tip) --- */
const wavingHand=bx(ARM_W_*0.85,ARM_W_*0.85,ARM_W_*0.85,handMat);
wavingHand.position.set(-(TOR_W*0.5+ARM_W_*0.42), shY-ARM_H_*0.82, 0);
char.add(wavingHand);

/* --- Position character (walking pose) --- */
char.rotation.y = -0.35;
char.position.set(-0.1, 0, 0);
scene.add(char);

/* ─── Animate ─── */
let t2=0;
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=clock.getDelta();
  t2+=dt;

  // Gentle breathing / idle sway
  char.rotation.y = -0.35 + Math.sin(t2*0.6)*0.12;
  head.rotation.y = Math.sin(t2*0.5)*0.1;
  head.position.y = hcY + Math.sin(t2*1.2)*0.008;

  // Arm swing
  armRGroup.rotation.x = -1.05 + Math.sin(t2*1.5)*0.15;
  armLGroup.rotation.x =  0.32 - Math.sin(t2*1.5)*0.15;

  // Leg walk cycle
  legR.rotation.x = Math.sin(t2*1.5)*0.22;
  legL.rotation.x = -Math.sin(t2*1.5)*0.22;

  // Owl bobs
  owl.position.y = shY+0.05+Math.sin(t2*2)*0.012;
  owl.rotation.z = Math.sin(t2*0.9)*0.12;

  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
